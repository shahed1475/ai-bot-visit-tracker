name: CI
on: [push, pull_request]
jobs:
  middleware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: pdo_sqlite }
      - run: npm ci
      - run: pip install flask django user-agents
      - run: python3 tests/run_all_tests.py registry node pwa python php
  worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloudflare } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx wrangler types && npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run
      # The sensor users download is a built bundle of src/sensor.ts: it must never go stale.
      - run: npm run build:sensor
      - run: git diff --exit-code -- public/downloads/edge-sensor.js
  e2e:
    # A real tracker (wrangler dev on a throwaway local D1) plus a real app for every integration. See docs/TESTING.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_sqlite, curl" }
      - run: npm ci
      - run: npm ci
        working-directory: cloudflare
      - run: pip install flask django user-agents
      - run: node tests/e2e/run.mjs
